# YknMinions 主配置。修改后使用 /minions reload。
# 支持使用 & 颜色代码；可留空为 ""。
prefix: "&6[YknMinions] &r"
max-level: 11
# GUI 最多显示 15 格；1 级初始开放 5 格，每升一级再开放 1 格。
storage-slots: 15
initial-storage-slots: 5
storage-slots-per-level: 1
tick-period: 2
save-interval-seconds: 60

# 世界或区块卸载后不强制加载地图，而是根据动作时间补算产出。
# 不设置离线天数上限；仓库满后会停止生产。
offline-production:
  enabled: true
  settle-interval-seconds: 60
  # 补算采用全局轮询预算，避免大量岛屿同时恢复时阻塞主线程。
  max-actions-per-tick: 2000
  max-millis-per-tick: 4

diamond-spread:
  chance: 0.10
  amount: "1~5"
emerald-spread:
  chance: 0.10
  amount: "1~5"
iron-spread:
  chance: 0.10
  amount: "1~5"
gold-spread:
  chance: 0.10
  amount: "1~5"
lapis-spread:
  chance: 0.10
  amount: "1~5"

# efficiency 使用小数表示效率提升：0.10 表示提升 10%，实际工作速度为 1 + efficiency。
# burn-time-seconds 是每件燃料的燃烧时间（秒）；无尽能源不会耗尽，也不会被消耗。
# 煤炭、木炭、煤炭块、木炭块和普通岩浆桶均不能再作为燃料。
fuels:
  infinite_energy:
    efficiency: 0.00
  small_fuel:
    efficiency: 0.10
    burn-time-seconds: 3600
  medium_fuel:
    efficiency: 0.25
    burn-time-seconds: 10800
  super_fuel:
    efficiency: 0.50
    burn-time-seconds: 43200

messages:
  no-permission: "§c你没有权限执行此操作。"
  player-only: "§c该命令只能由玩家执行。"
  invalid-item: "§c这个物品不能放入该栏位。"
  storage-full: "§c小人的仓库已满。"
  catching-up: "§e该小人正在结算离线产出，请稍候。"
  collected: "§a已收取小人仓库中的资源。"
  collecting: "§e正在将小人仓库资源发放到背包或 Skyblock-Core 暂存中……"
  collection-pending: "§e该小人的上一笔领取仍在处理中，正在安全重试。"
  delivery-rejected: "§c背包和 Skyblock-Core 暂存均无法容纳这些物品，资源已解除锁定并保留在小人中。"
  delivery-failed: "§c本次领取暂未完成，资源仍安全保留并锁定在小人中，请稍后重试。"
  delivery-prepare-failed: "§c无法持久化领取记录，未发放任何物品，请检查服务器日志。"
  pickup-after-collection: "§e请等待仓库领取完成，再次点击收起小人。"
  upgraded: "§a小人已升级到等级 %level%。"
  not-enough-materials: "§c升级材料不足。"
  invalid-level: "§c请输入当前等级以上、最高 11 的有效等级。"
