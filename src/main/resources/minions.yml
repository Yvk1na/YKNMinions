# 物品写法：
#   minecraft:slime_ball
#   mmoitems:MATERIAL:ENCHANTED_SLIME
#   itemsadder:namespace:item_id
#   craftengine:namespace:item_id
types:
  slime:
    display-name: "§aSlime Minion"
    drop: "minecraft:slime_ball"
    drop-amount: "1~2"
    work-sound: "ENTITY_SLIME_SQUISH"
    slime-settings:
      # 数值是权重；不必正好等于 100。键为 Minecraft 史莱姆大小（1=小、2=中、4=大）。
      size-chances:
        1: 50.0
        2: 35.0
        4: 15.0
      # 每击杀一个史莱姆获得的资源数量，支持固定数字或随机范围，例如 "1~5"。
      drop-per-kill: "1~5"
      # 小人转向目标后等待多少 tick 再攻击，20 tick = 1 秒。
      turn-delay-ticks: 10
    model:
      helmet: "minecraft:slime_block"
      chestplate: "minecraft:leather_chestplate"
      leggings: "minecraft:leather_leggings"
      boots: "minecraft:leather_boots"
      tool: "minecraft:iron_sword"
      leather-color: "80,200,90"
    levels:
      1:
        work-interval-seconds: 12.0
        upgrade-materials: []
      2:
        work-interval-seconds: 11.5
        upgrade-materials:
          - { item: "minecraft:slime_ball", amount: 80 }
      3:
        work-interval-seconds: 11.0
        upgrade-materials:
          - { item: "minecraft:slime_ball", amount: 160 }
      4:
        work-interval-seconds: 10.5
        upgrade-materials:
          - { item: "minecraft:slime_ball", amount: 320 }
      5:
        work-interval-seconds: 10.0
        upgrade-materials:
